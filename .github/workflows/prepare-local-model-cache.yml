name: Prepare local model cache

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  prepare-model:
    name: Cache ${{ matrix.model_id }} weights
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - model_id: qwen2_5_3b
            model_file: Qwen2.5-3B-Instruct-Q4_K_M.gguf
          - model_id: llama3_2_3b
            model_file: Llama-3.2-3B-Instruct-Q4_K_M.gguf
          - model_id: gemma3_4b
            model_file: gemma-3-4b-it-Q4_K_M.gguf

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install model downloader
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[models]"
          python -m pip check

      # This key and path intentionally match local-model-benchmark.yml so the
      # next benchmark can restore these exact model files without downloading.
      - name: Restore model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/weights
          key: gguf-${{ runner.os }}-${{ matrix.model_id }}-${{ hashFiles('models/catalog.json') }}
          restore-keys: |
            gguf-${{ runner.os }}-${{ matrix.model_id }}-

      - name: Download on cache miss
        env:
          MODEL_ID: ${{ matrix.model_id }}
          MODEL_FILE: ${{ matrix.model_file }}
        run: |
          model_path="models/weights/$MODEL_FILE"
          metadata_path="$model_path.metadata.json"
          valid=false
          if [[ -s "$model_path" && -s "$metadata_path" ]]; then
            if python - "$MODEL_ID" "$MODEL_FILE" "$metadata_path" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          model_id, filename, metadata_path = sys.argv[1:]
          metadata = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
          catalog = json.loads(Path("models/catalog.json").read_text(encoding="utf-8"))
          expected = catalog["models"][model_id]
          model_path = Path("models/weights") / filename
          hasher = hashlib.sha256()
          with model_path.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  hasher.update(chunk)
          digest = hasher.hexdigest()
          valid = (
              metadata.get("model_id") == model_id
              and metadata.get("repo_id") == expected["repo_id"]
              and metadata.get("filename") == filename == expected["filename"]
              and metadata.get("revision_requested") == expected.get("revision", "main")
              and bool(metadata.get("revision_resolved"))
              and metadata.get("sha256") == digest
          )
          raise SystemExit(0 if valid else 1)
          PY
            then
              valid=true
            fi
          fi
          if [[ "$valid" == "true" ]]; then
            echo "Verified cached model $MODEL_ID"
          elif [[ "${{ steps.model-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "A cached model exists but failed provenance/integrity validation; refusing to overwrite an immutable cache key." >&2
            exit 1
          else
            echo "Downloading $MODEL_ID"
            rm -f "$model_path" "$metadata_path"
            python scripts/download_models.py --model "$MODEL_ID"
          fi

      - name: Verify prepared model and report cache provenance
        env:
          MODEL_ID: ${{ matrix.model_id }}
          MODEL_FILE: ${{ matrix.model_file }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          model = Path("models/weights") / os.environ["MODEL_FILE"]
          metadata = json.loads(model.with_suffix(model.suffix + ".metadata.json").read_text(encoding="utf-8"))
          hasher = hashlib.sha256()
          with model.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  hasher.update(chunk)
          digest = hasher.hexdigest()
          if digest != metadata.get("sha256"):
              raise SystemExit(f"SHA-256 mismatch for {model}")
          print(json.dumps({
              "model_id": os.environ["MODEL_ID"],
              "filename": model.name,
              "bytes": model.stat().st_size,
              "sha256": digest,
              "resolved_revision": metadata.get("revision_resolved"),
              "repo_id": metadata.get("repo_id"),
          }, indent=2))
          PY
