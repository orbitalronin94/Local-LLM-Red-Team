name: Local model red-team benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-model-benchmark.yml"
      - "scripts/download_models.py"
      - "models/catalog.json"
      - "redteam.py"
      - "scenarios.py"
      - "review.py"
      - "paired.py"
      - "pyproject.toml"
      - "tests/test_model_assets.py"
      - "tests/test_scenarios.py"
      - "tests/test_review.py"
      - "tests/test_paired.py"

permissions:
  contents: read

concurrency:
  group: local-model-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-llama-server:
    name: Build reusable llama.cpp CPU server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build llama.cpp CPU server once
        run: |
          git init /tmp/llama.cpp
          git -C /tmp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/llama.cpp fetch --depth 1 origin 10f173b253173e9cca4e81a4803a0f01989d1b29
          git -C /tmp/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = "10f173b253173e9cca4e81a4803a0f01989d1b29"
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build /tmp/llama.cpp/build --config Release --target llama-server -j2
          # Do not run the upstream all-target install: it also installs optional
          # examples that are intentionally not built by the llama-server target.
          # Bundle only the binaries and shared libraries produced by this build.
          install_dir="$RUNNER_TEMP/llama-install"
          mkdir -p "$install_dir/bin"
          cp -a /tmp/llama.cpp/build/bin/. "$install_dir/bin/"
          test -x "$install_dir/bin/llama-server"
          echo "$RUNNER_TEMP/llama-install/bin" >> "$GITHUB_PATH"
          export LD_LIBRARY_PATH="$install_dir/bin:${LD_LIBRARY_PATH:-}"
          "$install_dir/bin/llama-server" --version
          if ldd "$install_dir/bin/llama-server" | grep -q "not found"; then
            ldd "$install_dir/bin/llama-server"
            echo "llama-server has unresolved shared-library dependencies" >&2
            exit 1
          fi
          git -C /tmp/llama.cpp rev-parse HEAD > "$install_dir/LLAMA_CPP_COMMIT"
          # Archive to preserve executable bits and shared-library symlinks.
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/llama-install.tar.gz" llama-install

      - name: Upload reusable llama.cpp installation
        uses: actions/upload-artifact@v6
        with:
          name: llama-cpp-cpu-server
          path: ${{ runner.temp }}/llama-install.tar.gz
          if-no-files-found: error
          retention-days: 1

  benchmark:
    needs: build-llama-server
    name: Pentest ${{ matrix.model_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - model_id: smollm2
            model_file: SmolLM2-360M-Instruct-Q4_K_M.gguf
          - model_id: qwen2_5
            model_file: qwen2.5-0.5b-instruct-q4_k_m.gguf
          - model_id: llama3_2_1b
            model_file: Llama-3.2-1B-Instruct-Q4_K_M.gguf
          - model_id: gemma3_1b
            model_file: google_gemma-3-1b-it-Q4_K_M.gguf

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,models]"
          python -m pip check

      # GitHub-hosted runners are ephemeral. Persist each model independently
      # so later runs restore the GGUF instead of downloading it again.
      - name: Restore cached GGUF model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/weights
          key: gguf-${{ runner.os }}-${{ matrix.model_id }}-${{ hashFiles('models/catalog.json') }}
          restore-keys: |
            gguf-${{ runner.os }}-${{ matrix.model_id }}-

      - name: Download model on cache miss
        env:
          MODEL_FILE: ${{ matrix.model_file }}
          MODEL_ID: ${{ matrix.model_id }}
        run: |
          model_path="models/weights/$MODEL_FILE"
          metadata_path="$model_path.metadata.json"
          cache_valid=false
          if [[ -s "$model_path" && -s "$metadata_path" ]]; then
            if python - "$MODEL_ID" "$MODEL_FILE" "$metadata_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          model_id, filename, metadata_path = sys.argv[1:]
          metadata = json.loads(Path(metadata_path).read_text(encoding="utf-8"))
          catalog = json.loads(Path("models/catalog.json").read_text(encoding="utf-8"))
          expected = catalog["models"][model_id]
          valid = (
              metadata.get("model_id") == model_id
              and metadata.get("repo_id") == expected["repo_id"]
              and metadata.get("filename") == filename == expected["filename"]
              and metadata.get("revision_requested") == expected.get("revision", "main")
              and bool(metadata.get("sha256"))
          )
          raise SystemExit(0 if valid else 1)
          PY
            then
              cache_valid=true
            fi
          fi
          if [[ "$cache_valid" == "true" ]]; then
            echo "Using verified cache metadata for $MODEL_ID: $model_path"
          else
            echo "Model cache miss, stale metadata or incomplete cache; downloading $MODEL_ID"
            rm -f "$model_path" "$metadata_path"
            python scripts/download_models.py --model "$MODEL_ID"
          fi

      - name: Verify model integrity
        env:
          MODEL_FILE: ${{ matrix.model_file }}
          MODEL_ID: ${{ matrix.model_id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          model = Path("models/weights") / os.environ["MODEL_FILE"]
          metadata = json.loads(model.with_suffix(model.suffix + ".metadata.json").read_text())
          hasher = hashlib.sha256()
          with model.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  hasher.update(chunk)
          digest = hasher.hexdigest()
          catalog = json.loads(Path("models/catalog.json").read_text(encoding="utf-8"))
          model_id = os.environ["MODEL_ID"] if "MODEL_ID" in os.environ else None
          expected = catalog["models"].get(model_id, {}) if model_id else {}
          if (metadata.get("model_id") != model_id
                  or metadata.get("filename") != model.name
                  or metadata.get("repo_id") != expected.get("repo_id")
                  or metadata.get("revision_requested") != expected.get("revision", "main")):
              raise SystemExit(f"Model provenance mismatch for {model}")
          if metadata.get("sha256") != digest:
              raise SystemExit(f"SHA-256 mismatch for {model}")
          print(f"Verified {model.name}: {metadata['bytes']} bytes, sha256={digest}")
          PY

      - name: Download reusable llama.cpp server
        uses: actions/download-artifact@v6
        with:
          name: llama-cpp-cpu-server
          path: ${{ runner.temp }}

      - name: Configure prebuilt llama.cpp runtime
        run: |
          tar -xzf "$RUNNER_TEMP/llama-install.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/llama-install/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/llama-install/lib:$RUNNER_TEMP/llama-install/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          test -x "$RUNNER_TEMP/llama-install/bin/llama-server"
          cat "$RUNNER_TEMP/llama-install/LLAMA_CPP_COMMIT"
          "$RUNNER_TEMP/llama-install/bin/llama-server" --version

      - name: Record runner capacity
        run: |
          echo "Logical CPUs: $(nproc)"
          free -h
          df -h .

      - name: Start local inference endpoint
        run: |
          mkdir -p reports
          llama-server --model "models/weights/${{ matrix.model_file }}" --ctx-size 4096 --threads 2 --parallel 1 --host 127.0.0.1 --port 8080 > "reports/server.log" 2>&1 &
          echo $! > reports/server.pid
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              echo "llama-server is ready"
              exit 0
            fi
            sleep 2
          done
          cat reports/server.log
          exit 1

      - name: Include authorized-use and legal notice in report bundle
        run: |
          mkdir -p reports
          cp docs/legal-use.md reports/LEGAL-USE.en.txt
          cp docs/legal-use.es.md reports/AVISO-USO-AUTORIZADO.es.txt

      - name: Record benchmark provenance
        run: |
          {
            echo "model_id=${{ matrix.model_id }}"
            echo "model_file=${{ matrix.model_file }}"
            echo "llama_cpp_commit=$(cat "$RUNNER_TEMP/llama-install/LLAMA_CPP_COMMIT")"
            echo "python=$(python --version)"
            echo "runner=$(uname -a)"
            cat "models/weights/${{ matrix.model_file }}.metadata.json"
            sha256sum "models/weights/${{ matrix.model_file }}"
            python redteam.py --list-attacks
          } > "reports/provenance.txt"

      - name: Warm up model and verify chat endpoint
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/v1/chat/completions -H 'Content-Type: application/json' -d '{"model":"local-model","messages":[{"role":"user","content":"Reply with exactly: READY"}],"temperature":0,"max_tokens":8}' | tee reports/warmup.json

      - name: Run complete static attack catalogue
        run: |
          python redteam.py --target openai --url http://127.0.0.1:8080/v1 --model local-model --timeout 180 --db "reports/${{ matrix.model_id }}-static.db" --json "reports/${{ matrix.model_id }}-static.json" --report "reports/${{ matrix.model_id }}-static.md"

      - name: Run complete adaptive attack catalogue
        run: |
          python redteam.py --target openai --url http://127.0.0.1:8080/v1 --model local-model --timeout 180 --mode adaptive --attacker-target openai --attacker-model local-model --adaptive-rounds 2 --db "reports/${{ matrix.model_id }}-adaptive.db" --json "reports/${{ matrix.model_id }}-adaptive.json" --report "reports/${{ matrix.model_id }}-adaptive.md"

      - name: Run deterministic multi-turn scenarios
        run: |
          python scenarios.py --target openai --url http://127.0.0.1:8080/v1 --model local-model --timeout 180 --json "reports/${{ matrix.model_id }}-scenarios.json" --report "reports/${{ matrix.model_id }}-scenarios.md"

      - name: Run paired English-Spanish probes and benign controls
        run: |
          python paired.py --target openai --url http://127.0.0.1:8080/v1 --model local-model --timeout 180 --json "reports/${{ matrix.model_id }}-paired-language.json" --report "reports/${{ matrix.model_id }}-paired-language.md"

      - name: Attach model and inference provenance to every report
        if: always()
        env:
          MODEL_ID: ${{ matrix.model_id }}
          MODEL_FILE: ${{ matrix.model_file }}
          LLAMA_CPP_COMMIT: 10f173b253173e9cca4e81a4803a0f01989d1b29
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          model_path = Path("models/weights") / os.environ["MODEL_FILE"]
          metadata_path = model_path.with_suffix(model_path.suffix + ".metadata.json")
          model_metadata = {}
          if metadata_path.is_file():
              model_metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          catalog = json.loads(Path("models/catalog.json").read_text(encoding="utf-8"))
          catalog_entry = catalog["models"][os.environ["MODEL_ID"]]
          digest = ""
          if model_path.is_file():
              hasher = hashlib.sha256()
              with model_path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      hasher.update(chunk)
              digest = hasher.hexdigest()
          identity = {
              "catalog_model_id": os.environ["MODEL_ID"],
              "model_file": os.environ["MODEL_FILE"],
              "model_repo_id": model_metadata.get("repo_id", ""),
              "model_revision_requested": model_metadata.get("revision_requested", ""),
              "model_revision_resolved": model_metadata.get("revision_resolved", ""),
              "model_resolved_url": model_metadata.get("resolved_url", ""),
              "model_sha256": digest or model_metadata.get("sha256", ""),
              "model_bytes": model_metadata.get("bytes"),
              "quantization": model_metadata.get("quantization", catalog_entry.get("quantization", "")),
              "upstream_model": model_metadata.get("upstream_model", catalog_entry.get("upstream_model", "")),
              "model_card": model_metadata.get("model_card", catalog_entry.get("model_card", "")),
              "inference_engine": "llama.cpp",
              "inference_engine_commit": os.environ["LLAMA_CPP_COMMIT"],
          }
          for path in sorted(Path("reports").glob("*.json")):
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              payload["model_metadata"] = identity
              payload.setdefault("run_metadata", {}).update(identity)
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("reports/model-provenance.json").write_text(
              json.dumps(identity, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Export human-review worksheet
        if: always()
        run: |
          inputs=()
          for report in \
            "reports/${{ matrix.model_id }}-static.json" \
            "reports/${{ matrix.model_id }}-adaptive.json" \
            "reports/${{ matrix.model_id }}-scenarios.json" \
            "reports/${{ matrix.model_id }}-paired-language.json"; do
            if [[ -s "$report" ]]; then inputs+=(--input "$report"); fi
          done
          if (( ${#inputs[@]} > 0 )); then
            python review.py "${inputs[@]}" --output "reports/${{ matrix.model_id }}-human-review.csv"
          fi

      - name: Stop inference server
        if: always()
        run: |
          if [ -f reports/server.pid ]; then kill "$(cat reports/server.pid)" || true; fi

      - name: Upload reports and provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: redteam-reports-${{ matrix.model_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
