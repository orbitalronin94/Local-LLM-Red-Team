name: Local model red-team benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/local-model-benchmark.yml"
      - "scripts/download_models.py"
      - "models/catalog.json"
      - "redteam.py"
      - "tests/test_model_assets.py"

permissions:
  contents: read

concurrency:
  group: local-model-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Pentest ${{ matrix.model_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - model_id: smollm2
            model_file: SmolLM2-360M-Instruct-Q4_K_M.gguf
          - model_id: qwen2_5
            model_file: qwen2.5-0.5b-instruct-q4_k_m.gguf
          - model_id: llama3_2_1b
            model_file: Llama-3.2-1B-Instruct-Q4_K_M.gguf
          - model_id: gemma3_1b
            model_file: google_gemma-3-1b-it-Q4_K_M.gguf
          - model_id: granite3_3_2b
            model_file: granite-3.3-2b-instruct-Q4_K_M.gguf
          - model_id: phi3_5_mini
            model_file: Phi-3.5-mini-instruct-Q4_K_M.gguf
          - model_id: ministral_3b
            model_file: Ministral-3b-instruct-Q4_K_M.gguf

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,models]"
          python -m pip check

      # GitHub-hosted runners are ephemeral. Persist each model independently
      # so later runs restore the GGUF instead of downloading it again.
      - name: Restore cached GGUF model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/weights
          key: gguf-${{ runner.os }}-${{ matrix.model_id }}-${{ hashFiles('models/catalog.json') }}

      - name: Download model on cache miss
        env:
          MODEL_FILE: ${{ matrix.model_file }}
          MODEL_ID: ${{ matrix.model_id }}
        run: |
          model_path="models/weights/$MODEL_FILE"
          metadata_path="$model_path.metadata.json"
          if [[ -s "$model_path" && -s "$metadata_path" ]]; then
            echo "Using cached model: $model_path"
          else
            echo "Model cache miss or incomplete cache; downloading $MODEL_ID"
            rm -f "$model_path" "$metadata_path"
            python scripts/download_models.py --model "$MODEL_ID"
          fi

      - name: Verify model integrity
        env:
          MODEL_FILE: ${{ matrix.model_file }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          model = Path("models/weights") / os.environ["MODEL_FILE"]
          metadata = json.loads(model.with_suffix(model.suffix + ".metadata.json").read_text())
          hasher = hashlib.sha256()
          with model.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  hasher.update(chunk)
          digest = hasher.hexdigest()
          if digest != metadata["sha256"]:
              raise SystemExit(f"SHA-256 mismatch for {model}")
          print(f"Verified {model.name}: {metadata['bytes']} bytes, sha256={digest}")
          PY

      - name: Build llama.cpp CPU server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build /tmp/llama.cpp/build --config Release --target llama-server -j2
          echo "/tmp/llama.cpp/build/bin" >> "$GITHUB_PATH"
          /tmp/llama.cpp/build/bin/llama-server --version

      - name: Start local inference endpoint
        run: |
          mkdir -p reports
          llama-server --model "models/weights/${{ matrix.model_file }}" --ctx-size 4096 --threads 2 --host 127.0.0.1 --port 8080 > "reports/server.log" 2>&1 &
          echo $! > reports/server.pid
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              echo "llama-server is ready"
              exit 0
            fi
            sleep 2
          done
          cat reports/server.log
          exit 1

      - name: Record benchmark provenance
        run: |
          {
            echo "model_id=${{ matrix.model_id }}"
            echo "model_file=${{ matrix.model_file }}"
            echo "llama_cpp_commit=$(git -C /tmp/llama.cpp rev-parse HEAD)"
            echo "python=$(python --version)"
            echo "runner=$(uname -a)"
            cat "models/weights/${{ matrix.model_file }}.metadata.json"
            sha256sum "models/weights/${{ matrix.model_file }}"
            python redteam.py --list-attacks
          } > "reports/provenance.txt"

      - name: Run complete static attack catalogue
        run: |
          python redteam.py --target openai --url http://127.0.0.1:8080/v1 --model local-model --timeout 180 --db "reports/${{ matrix.model_id }}-static.db" --json "reports/${{ matrix.model_id }}-static.json" --report "reports/${{ matrix.model_id }}-static.md"

      - name: Run complete adaptive attack catalogue
        run: |
          python redteam.py --target openai --url http://127.0.0.1:8080/v1 --model local-model --timeout 180 --mode adaptive --attacker-target openai --attacker-model local-model --adaptive-rounds 2 --db "reports/${{ matrix.model_id }}-adaptive.db" --json "reports/${{ matrix.model_id }}-adaptive.json" --report "reports/${{ matrix.model_id }}-adaptive.md"

      - name: Stop inference server
        if: always()
        run: |
          if [ -f reports/server.pid ]; then kill "$(cat reports/server.pid)" || true; fi

      - name: Upload reports and provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: redteam-reports-${{ matrix.model_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
