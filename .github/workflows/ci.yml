name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check

      - name: Verify installed command
        run: |
          local-llm-redteam --selftest
          local-llm-redteam --list-attacks
          local-llm-redteam-protocol --help
          local-llm-redteam-matrix --help
          local-llm-redteam-replay --help

      - name: Run test suite with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Enforce coverage threshold
        run: python -m coverage report --fail-under=74
