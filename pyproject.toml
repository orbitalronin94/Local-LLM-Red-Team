[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-redteam"
version = "0.1.0"
description = "Local-first Python harness for reproducible prompt-level security testing of locally hosted LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
{name = "David Ferrández Canalis"}
]
keywords = [
"local-llm",
"llm",
"llm-security",
"llm-red-teaming",
"security-testing",
"adversarial-testing",
"prompt-injection",
"prompt-injection-testing",
"jailbreak",
"jailbreak-testing",
"ollama",
"openai-compatible",
"ai-safety",
"evaluation"
]
classifiers = [
"Development Status :: 3 - Alpha",
"Intended Audience :: Developers",
"Intended Audience :: Science/Research",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Topic :: Security",
"Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/orbitalronin94/Local-LLM-Red-Team"
Repository = "https://github.com/orbitalronin94/Local-LLM-Red-Team"
Documentation = "https://github.com/orbitalronin94/Local-LLM-Red-Team#readme"
Issues = "https://github.com/orbitalronin94/Local-LLM-Red-Team/issues"

[project.optional-dependencies]
dev = [
"pytest>=8,<9",
"pytest-cov>=5,<7"
]
models = [
"huggingface-hub>=0.30,<2"
]

[project.scripts]
local-llm-redteam = "redteam:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["redteam"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.setuptools]
py-modules = ["redteam", "scenarios", "review"]
