[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-redteam"
version = "0.1.0"
description = "Small, local-first red teaming harness for testing LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
{name = "David Ferrández Canalis"}
]
keywords = [
"llm",
"red-team",
"security",
"ai-safety",
"prompt-injection",
"jailbreak",
"ollama",
"evaluation"
]
classifiers = [
"Development Status :: 3 - Alpha",
"Intended Audience :: Developers",
"Intended Audience :: Science/Research",
"License :: OSI Approved :: MIT License",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.10",
"Programming Language :: Python :: 3.11",
"Programming Language :: Python :: 3.12",
"Topic :: Security",
"Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
dev = [
"pytest>=8,<9",
"pytest-cov>=5,<7"
]

[project.scripts]
local-llm-redteam = "redteam:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["redteam"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
